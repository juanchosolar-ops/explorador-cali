function matrizSemaforo(p) {
  const [a, b] = p.ciudades;
  const filas = p.criterios_pieza.map(cr => {
    const celda = ciudad => p.celdas.find(c => c.criterio === cr.criterio && c.ciudad === ciudad);
    const hall = p.hallazgos.find(h => h.criterio === cr.criterio);
    const td = c => { cita(c.cifras);
      return `<td>${boton("celda", `${chip(c.estado, "semaforo")}${c.corregido ? ' <span class="corr">Corregido</span>' : ""}<div${dc(c.cifras, p.id)}>${T(c.texto)}</div><span class="cfr ui-num">${c.cifras.length} cifra${c.cifras.length === 1 ? "" : "s"} citada${c.cifras.length === 1 ? "" : "s"}</span>`,
        () => [`${cr.nombre} · ${nombre(c.ciudad)}`, cuerpoItem({estadoHtml: chip(c.estado, "semaforo"), corregido: c.corregido, texto: c.texto, cifras: c.cifras, extra: `<p class="meta">${esc(p.titulo)} · corte ${esc(p.fecha_corte)}</p>`})],
        `${cr.nombre}, ${nombre(c.ciudad)}: ${D.escalas.semaforo[c.estado]}. Abrir detalle`)}</td>`; };
    cita(hall.cifras);
    return `<tr><td class="crit"><b>${esc(cr.nombre)}</b><span>${esc(cr.descripcion)}</span></td>${td(celda(a))}${td(celda(b))}
      <td>${boton("celda hall", `<div${dc(hall.cifras, p.id)}>${T(hall.texto)}</div><span class="cfr ui-num">Hallazgo · ${hall.cifras.length} cifra${hall.cifras.length === 1 ? "" : "s"}</span>`,
        () => [`${cr.nombre} · Hallazgo clave`, cuerpoItem({texto: hall.texto, cifras: hall.cifras})], `Hallazgo de ${cr.nombre}. Abrir detalle`)}</td></tr>`;
  }).join("");
  const sub = c => c === "cali" ? "datos.cali.gov.co" : "";
  return `<div class="tw"><table class="matriz"><caption class="sr">Matriz de ${esc(p.titulo)} en escala de semáforo</caption>
    <thead><tr><th scope="col">Criterio</th><th scope="col">${esc(nombre(a))}<small>${sub(a)}</small></th><th scope="col">${esc(nombre(b))}</th><th scope="col">Hallazgo clave</th></tr></thead><tbody>${filas}</tbody></table></div>`;
}
function tablaNiveles(p, filas, titulo, conDesc) {
  const cols = p.ciudades;
  const tr = filas.map(f => { cita(f.cifras);
    const det = () => [`${f.nombre}`, cuerpoItem({extra: `<div class="escala">${cols.map(c => `<div><b>${esc(nombre(c))}</b> ${chip(f.niveles[c], "niveles")}</div>`).join("")}</div><p class="meta">Referencia: ${esc(f.referencia)}</p><h3 style="font-size:14px;margin-top:10px">Evidencia</h3>`, corregido: f.corregido, texto: f.texto, cifras: f.cifras})];

const LSP = "explorador-priorizar-v1";
function leerP() { try { return JSON.parse(localStorage.getItem(LSP) || "null") || {}; } catch (e) { return {}; } }

function estadoP() {
  const st = leerP(); st.pesos = st.pesos || {}; st.p = st.p || {};
  D.priorizar.componentes.forEach(c => { if (!(c.id in st.pesos)) st.pesos[c.id] = c.peso; });

}
function puntajeP(st, id) {
  const pz = st.p[id] || {}, comps = D.priorizar.componentes.filter(c => pz[c.id] !== undefined && pz[c.id] !== "");
  if (!comps.length) return null;
  const w = comps.reduce((a, c) => a + (+st.pesos[c.id] || 0), 0);
  return {v: w ? comps.reduce((a, c) => a + (+pz[c.id]) * (+st.pesos[c.id] || 0), 0) / w : 0, n: comps.length};
}
function ordenP(st) {
  const lista = candidatosP(st).map((c, i) => ({c, i, s: puntajeP(st, c.id), no: (st.p[c.id] || {}).r === "No apto"}));
  const asc = st.orden === "asc";
  lista.sort((a, b) => (a.no - b.no) || ((a.s === null) - (b.s === null)) || (a.s && b.s ? (asc ? a.s.v - b.s.v : b.s.v - a.s.v) : 0) || a.i - b.i);
  return lista;
}

function calcular(st, id) {
  const pz = st.p[id] || {}, comps = D.priorizar.componentes;
  const val = comps.filter(c => c.eje === "valor"), fac = comps.find(c => c.eje === "facilidad");
  const falt = comps.filter(c => pz[c.id] === undefined || pz[c.id] === "");
  if (falt.length || !pz.r) return {ok: false, falta: falt.length + (pz.r ? 0 : 1)};
  const w = val.reduce((a, c) => a + (+st.pesos[c.id] || 0), 0);
  const v = w ? val.reduce((a, c) => a + (+pz[c.id]) * (+st.pesos[c.id] || 0), 0) / w : 0;
  const f = +pz[fac.id];
  const cuad = pz.r === "No apto" ? "No apto (riesgo)" : v >= 1.5 && f >= 1.5 ? "Victoria temprana" : v >= 1.5 ? "Largo plazo" : f >= 1.5 ? "Medio plazo" : "No aporta valor";
  return {ok: true, v, f, cuad, riesgo: pz.r};
}

    ${pts.length ? "" : `<text x="${W / 2}" y="${H / 2}" font-size="13" text-anchor="middle" fill="currentColor" opacity=".7">Califique los siete componentes y el riesgo de un conjunto para ubicarlo</text>`}

  const a = D.auditoria_enlaces;
  const I_MED_DEFS = `<ul class="lst">${Object.entries(D.indicadores.mediciones[0].definiciones).map(([k, v]) => `<li>${esc(v)}</li>`).join("")}</ul>`;
  return cabecera("Fuentes y método", "Registro de verificación", "Todas las fuentes del explorador están aquí: cada cifra con su valor, nivel de acceso, fecha y consulta exacta, además de las referencias y el método. El registro manda: una cifra que no esté aquí no entra en ninguna pieza.") +
    `<div class="stack"><section class="card"><div class="card-h"><h2>Registro de cifras</h2><span class="meta">Buscador y filtros por ciudad y nivel de acceso</span></div><div class="card-b">
      <div class="filtros no-print"><label class="sr" for="q">Buscar en el registro</label><input id="q" type="search" placeholder="Buscar dato, valor o consulta…">
      <label class="sr" for="fc">Filtrar por ciudad</label><select id="fc"><option value="">Todas las ciudades</option>${D.ciudades.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select>
      <label class="sr" for="fa">Filtrar por nivel de acceso</label><select id="fa"><option value="">Todos los accesos</option>${accesos.map(x => `<option>${esc(x)}</option>`).join("")}</select>
      <span class="meta ui-num" id="n-reg" aria-live="polite"></span></div>
      <div class="tw"><table class="reg"><caption class="sr">Registro de verificación</caption><thead><tr><th scope="col">Ciudad</th><th scope="col">Dato</th><th scope="col">Valor</th><th scope="col">Acceso</th><th scope="col">Fecha</th><th scope="col">Consulta o fuente</th><th scope="col">Identificador</th></tr></thead><tbody id="tb-reg">${filas}</tbody></table></div></div></section>
    <div class="grid2">
      
      <section class="card"><div class="card-h"><h2>Portales bloqueados</h2></div><div class="card-b stack">${D.bloqueos.map(b => `<div><b>${esc(CIU[b.ciudad].nombre)} · ${esc(b.dato)}</b><div class="meta"><code>${esc(b.dominio)}</code> · ${md(b.motivo)} · ${esc(b.fecha)}</div>${b.resuelto ? `<div class="meta"><span class="corr">Resuelto</span> ${esc(b.resuelto)}</div>` : ""}${b.revision ? `<div><span class="corr">Pendiente de revisión</span></div>` : ""}</div>`).join("")}</div></section>
      <section class="card"><div class="card-h"><h2>Método de medición de catálogos</h2></div><div class="card-b stack"><p class="nota-m">Los catálogos se descargaron completos y se calcularon con el mismo método el mismo día. Cali y Montevideo: 10-oct-2026 (paginación completa de <code>package_search</code>). Comparativo Cali–Buenos Aires: 6-oct-2026. Singapur: 24-nov-2026, lectura completa de la API de data.gov.sg (561 páginas) desde el navegador integrado.</p>${I_MED_DEFS}<p class="nota-m">Singapur no es comparable de forma directa: usa la fecha lastUpdatedAt del portal, cada conjunto es un solo archivo y no se pudieron medir API con filtros, etiquetas ni licencia. Ver las advertencias en «Indicadores».</p></div></section>
      <section class="card" data-plegada="si"><div class="card-h"><h2>Fuentes de cada pieza</h2></div><div class="card-b stack">${D.piezas.map(p => `<div><b>${esc(p.titulo)}</b><div class="meta">Corte: ${esc(p.fecha_corte)}</div><p class="nota-m" style="margin-top:4px">${T(p.fuentes.texto)}</p></div>`).join("")}</div></section>
      <section class="card" data-plegada="si"><div class="card-h"><h2>Respaldo de las ideas centrales y de la evidencia por sector</h2></div><div class="card-b stack"><p class="nota-m">${esc(D.valor.fuente)}</p>${D.valor.tesis.filter(x => x.respaldo).map(x => `<div><b>${esc(x.titulo)}</b><div class="meta">${esc(x.respaldo)}</div></div>`).join("")}<div class="tw"><table class="reg" style="min-width:640px"><thead><tr><th scope="col">Sector</th><th scope="col">Fuente</th><th scope="col">Acceso</th></tr></thead><tbody>${D.valor.sectores.map(x => `<tr><th scope="row" style="text-align:left">${esc(x.sector)}</th><td>${esc(x.fuente)}</td><td>${esc(x.acceso)}</td></tr>`).join("")}</tbody></table></div><div><b>Dominios de impacto: fuentes de la armonización</b><div class="meta">${D.valor.dominios.cols.slice(1).map(esc).join(" · ")}</div></div></div></section>
      <section class="card" data-plegada="si"><div class="card-h"><h2>Fuentes del modelo de priorización</h2></div><div class="card-b stack"><p class="nota-m">${esc(D.priorizar.nota)}</p><p class="nota-m">${esc(D.priorizar.medicion.nota)}</p>${D.priorizar.componentes.map(k => `<div><b>${esc(k.nombre)}</b><div class="meta">${esc(k.fuente)}</div></div>`).join("")}</div></section>
      <section class="card" data-plegada="si"><div class="card-h"><h2>Gráfica de tipos de datos mejor valorados</h2></div><div class="card-b stack"><p class="nota-m">${esc(D.priorizar.vp.fuente)}</p><p class="nota-m">${esc(D.priorizar.vp.limite)}</p></div></section>
      <section class="card" data-plegada="si"><div class="card-h"><h2>Referencias de valor público</h2></div><div class="card-b">${refsHtml(D.valor.refs)}</div></section>
      <section class="card" data-plegada="si"><div class="card-h"><h2>Referencias de priorización</h2></div><div class="card-b">${refsHtml(D.priorizar.refs)}</div></section>
      <section class="card"><div class="card-h"><h2>${esc(D.validacion.titulo)}</h2><span class="meta">${esc(D.validacion.fecha)}</span></div><div class="card-b stack"><p class="nota-m">${esc(D.validacion.acceso)}</p><div><b>Coincide con el documento</b><ul class="lst">${D.validacion.coinciden.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><div><b>Diferencias con el documento</b><ul class="lst">${D.validacion.diferencias.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div><p class="nota-m">${esc(D.validacion.limite)}</p></div></section>
      
      
      <section class="card"><div class="card-h"><h2>Marco normativo colombiano</h2></div><div class="card-b">${D.valor.normativa.map((x, i) => `<div class="ins"><span class="n ui-num">${i + 1}</span><div><h3>${esc(x.titulo)}</h3><p>${esc(x.texto)}</p></div></div>`).join("")}</div></section>
      <section class="card"><div class="card-h"><h2>La escala</h2></div><div class="card-b stack"><div><b>Semáforo de cuatro estados, igual para todas las piezas</b><div class="escala" style="margin-top:6px">${Object.keys(D.escalas.semaforo).map(k => chip(k, "semaforo")).join("")}</div><p class="meta">«Sin evidencia»: ninguna fuente documenta ese aspecto.</p></div></div></section>
      
    </div></div>`;
}
function filtrarRegistro() {
  const q = ($("#q").value || "").toLowerCase(), c = $("#fc").value, a = $("#fa").value;
  let n = 0;
  document.querySelectorAll("#tb-reg tr").forEach(tr => { const ok = (!c || tr.dataset.c === c) && (!a || tr.dataset.a === a) && (!q || tr.textContent.toLowerCase().includes(q)); tr.hidden = !ok; if (ok) n++; });
  $("#n-reg").textContent = `${n} de ${D.cifras.length} cifras`;
}

/* ── Secciones plegables: el título de cada tarjeta es un botón que muestra u oculta su contenido.
   En «Comparación» empiezan contraídas; en las demás vistas, abiertas. El navegador recuerda lo que cada
   persona cambió. Un solo botón alterna «Expandir todo» y «Contraer todo». ── */
let cambiadas = {};
try { cambiadas = JSON.parse(localStorage.getItem("explorador-pliegue") || "{}"); } catch (e) {}
const guardarPliegue = () => { try { localStorage.setItem("explorador-pliegue", JSON.stringify(cambiadas)); } catch (e) {} };
let nPliegue = 0;
function actualizarTodo() {
  const b = document.getElementById("b-todo");
  if (!b) return;
  const todas = [...document.querySelectorAll("#main .plegar")];
  const abiertas = todas.length && todas.every(p => p.getAttribute("aria-expanded") === "true");
  const t = abiertas ? "Contraer todo" : "Expandir todo"; b.querySelector("span").textContent = t; b.setAttribute("aria-label", t);
  b.setAttribute("aria-pressed", abiertas);
}
function hacerPlegables(vista, contraidasPorDefecto) {
  document.querySelectorAll("#main .card").forEach(card => {
    const h = card.querySelector(":scope > .card-h"), h2 = h && h.querySelector("h2");
    if (!h2 || h2.querySelector(".plegar")) return;
    const cuerpo = document.createElement("div");
    cuerpo.className = "card-cuerpo"; cuerpo.id = "pl-" + (nPliegue++);
    [...card.children].filter(c => c !== h).forEach(c => cuerpo.appendChild(c));
    card.appendChild(cuerpo);
    const clave = vista + "|" + h2.textContent.trim();
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "plegar"; btn.setAttribute("aria-controls", cuerpo.id);
    btn.innerHTML = `<span class="flecha" aria-hidden="true">▼</span><span>${h2.innerHTML}</span>`;
    h2.replaceChildren(btn);
    const poner = abierto => { btn.setAttribute("aria-expanded", abierto); cuerpo.hidden = !abierto; card.classList.toggle("plegada", !abierto); };
    const porDefecto = card.dataset.plegada === "si" ? false : !contraidasPorDefecto;
    poner(clave in cambiadas ? cambiadas[clave] : porDefecto);
    btn.onclick = () => {
      const abierto = btn.getAttribute("aria-expanded") !== "true"; poner(abierto);
      if (abierto === porDefecto) delete cambiadas[clave]; else cambiadas[clave] = abierto;
      guardarPliegue(); actualizarTodo();
    };
  });
  // Botón único de expandir o contraer: en «Comparación» va bajo las pestañas de las piezas; en las demás vistas
  // con secciones plegables, se inserta bajo el encabezado de la vista.
  if (!document.getElementById("b-todo") && document.querySelector("#main .plegar")) {
    const barra = document.createElement("div");
    barra.className = "barra-pliegue no-print";
    barra.innerHTML = '<button type="button" class="pz-ibtn" id="b-todo" aria-pressed="false" aria-label="Expandir todo"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9l5-5 5 5M7 15l5 5 5-5"/></svg><span>Expandir todo</span></button>';
    const ancla = document.querySelector("#main > .vista-h, #main > .hero");
    if (ancla) ancla.after(barra); else document.getElementById("main").prepend(barra);
  }
  const todo = document.getElementById("b-todo");
  if (todo) todo.onclick = () => {
    const abrir = todo.getAttribute("aria-pressed") !== "true";
    document.querySelectorAll("#main .plegar").forEach(p => { if ((p.getAttribute("aria-expanded") === "true") !== abrir) p.click(); });
    actualizarTodo();
  };
  actualizarTodo();
}

/* ── Enrutador ── */
const VISTAS = {inicio: vInicio, comparacion: vComparacion, valor: vValor, priorizar: vPriorizar, indicadores: vIndicadores, fuentes: vFuentes};
function pieDeImpresion(vista) { return vista === "fuentes" ? "" : ""; }
function cerrarGrupos(excepto) {
  document.querySelectorAll(".g-btn").forEach(b => { if (b === excepto) return; b.setAttribute("aria-expanded", "false"); document.getElementById(b.getAttribute("aria-controls")).hidden = true; });
}
document.querySelectorAll(".g-btn").forEach(b => b.addEventListener("click", e => {
  e.stopPropagation(); const abrir = b.getAttribute("aria-expanded") !== "true"; cerrarGrupos(b);
  b.setAttribute("aria-expanded", abrir); const m = document.getElementById(b.getAttribute("aria-controls")); m.hidden = !abrir;
  if (abrir) { const a = m.querySelector("a"); if (a) a.focus(); }
}));
document.addEventListener("click", e => { if (!e.target.closest(".grupo")) cerrarGrupos(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { const ab = document.querySelector('.g-btn[aria-expanded="true"]'); if (ab) { cerrarGrupos(); ab.focus(); } } });
function ruta() {
  // Fragmentos simples («#comparacion-cali-singapur»): son los únicos que llegan desde el enlace de una página
  // publicada. También se aceptan los de barra («#comparacion/cali-singapur»).
  const h = decodeURIComponent(location.hash.replace(/^#/, "")) || "inicio";
  const sep = h.search(/[\/-]/);
  let [v, arg] = sep < 0 ? [h, ""] : [h.slice(0, sep), h.slice(sep + 1)];
  if (!VISTAS[v] && VISTAS[h]) { v = h; arg = ""; }
  const vista = VISTAS[v] ? v : "inicio";
  citadas = new Set(); regN = 0; for (const k in REG_PANEL) delete REG_PANEL[k];
  cerrarPanel();
  const m = $("#main");
  SINCITAS = vista !== "fuentes";
  m.innerHTML = VISTAS[vista](arg || "");
  m.insertAdjacentHTML("beforeend", pieDeImpresion(vista));
  document.querySelectorAll(".nav a, a.marca").forEach(a => { if (a.dataset.v === vista) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  document.querySelectorAll(".grupo").forEach(g => { g.querySelector(".g-btn").classList.toggle("activo", !!g.querySelector('a[aria-current="page"]')); cerrarGrupos(); });
  const pz = vista === "comparacion" ? (PZ[arg] || D.piezas[0]) : null;
  document.title = (pz ? pz.titulo + " · " : "") + ({inicio: "Inicio", comparacion: "Comparación", valor: "Valor público", priorizar: "Priorizar", indicadores: "Indicadores", fuentes: "Fuentes y método"}[vista]) + " · Explorador Datos Abiertos Cali";
  if (vista === "fuentes") {
    ["q", "fc", "fa"].forEach(i => $("#" + i).addEventListener("input", filtrarRegistro)); filtrarRegistro();
    if (arg && document.getElementById(arg)) document.getElementById(arg).scrollIntoView({block: "center"});
  }
  hacerPlegables(vista + (arg ? "-" + arg : ""), false);
  // Un enlace a una cifra del registro («#fuentes-<id>») abre el registro aunque se haya dejado plegado.
  if (vista === "fuentes" && arg && document.getElementById(arg)) {
    const card = document.getElementById(arg).closest(".card"), btn = card && card.querySelector(".plegar");
    if (btn && btn.getAttribute("aria-expanded") === "false") btn.click();
    document.getElementById(arg).scrollIntoView({block: "center"});
  }
  if (vista === "galeria") document.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => abrirVisor(b.dataset.ver, b));
  if (vista === "priorizar") activarPriorizar();
  if (vista === "comparacion") {
    const tabs = [...document.querySelectorAll(".tab")];
    tabs.forEach((t, i) => { t.onclick = () => { location.hash = "comparacion-" + t.dataset.pz; };
      t.onkeydown = e => { let j = null; if (e.key === "ArrowRight") j = (i + 1) % tabs.length; if (e.key === "ArrowLeft") j = (i - 1 + tabs.length) % tabs.length; if (e.key === "Home") j = 0; if (e.key === "End") j = tabs.length - 1;
        if (j != null) { e.preventDefault(); history.replaceState(null, "", "#comparacion-" + tabs[j].dataset.pz); ruta(); document.querySelectorAll(".tab")[j].focus(); } }; });
  }
  aplicarMarcas();
}
window.addEventListener("hashchange", () => {
  ruta(); $("#main").focus({preventScroll: true});
  // Un enlace a una fila del registro ya se desplazó hasta ella; las demás vistas empiezan arriba.
  if (!/^#fuentes-./.test(location.hash)) window.scrollTo(0, 0);
});

/* Etiquetas emergentes de las barras: ratón y teclado */
const tip = $("#tip");
function mostrarTip(el) { const r = el.getBoundingClientRect(); tip.innerHTML = esc(el.dataset.tip).replace(/&amp;#10;|\n/g, "<br>"); tip.hidden = false;
  const w = tip.offsetWidth; tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8)) + "px"; tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px"; }
document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (t) mostrarTip(t); });
document.addEventListener("mouseout", e => { if (e.target.closest("[data-tip]")) tip.hidden = true; });
document.addEventListener("focusin", e => { const t = e.target.closest("[data-tip]"); if (t) mostrarTip(t); else tip.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") tip.hidden = true; });
window.addEventListener("scroll", () => { tip.hidden = true; }, {passive: true});

ruta();
</script>
